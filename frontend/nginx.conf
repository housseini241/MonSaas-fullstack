server {
    listen 80;
    server_name hustart.fr;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA: service worker, manifest & app shell must never be cached
    # aggressively, otherwise PWA updates never reach clients.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA icons (content-addressed by the manifest) can be cached long-term
    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
