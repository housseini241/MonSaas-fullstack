server {
    listen 80;
    server_name hustart.fr;

    root /usr/share/nginx/html;
    index index.html;

    # SEO : snapshot HTML statique servi aux crawlers via le backend
    location ~ ^/site/(.+)$ {
        set $is_crawler 0;
        if ($http_user_agent ~* "(googlebot|bingbot|slurp|duckduckbot|facebookexternalhit|twitterbot|whatsapp|linkedinbot|pinterest|applebot|yandex)") {
            set $is_crawler 1;
        }
        if ($is_crawler = 1) {
            proxy_pass http://backend:8000/api/static-snapshot/$1;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SEO : sitemap.xml généré par le backend
    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/public/sitemap.xml;
        proxy_set_header Host $host;
    }

    # SEO : robots.txt statique du build frontend
    location = /robots.txt {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
    }

    # PWA: service worker, manifest & app shell must never be cached
    # aggressively, otherwise PWA updates never reach clients.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA icons (content-addressed by the manifest) can be cached long-term
    location /icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
